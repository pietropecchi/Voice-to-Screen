[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-to-screen-pipeline"
version = "0.1.0"
description = "Local pipeline service for Voice-to-Screen"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
